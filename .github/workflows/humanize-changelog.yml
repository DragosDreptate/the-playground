name: Humanize Changelog

# Se déclenche sur la PR Release Please (ouverte ou mise à jour)
on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - main

# Le GITHUB_TOKEN ne sert qu'à lire. L'écriture (push de la réécriture) passe
# par RELEASE_PLEASE_TOKEN, injecté uniquement au moment du push.
permissions:
  contents: read

jobs:
  humanize:
    name: Réécriture changelog en langage utilisateur
    # Ne tourne que sur les PRs de Release Please
    if: startsWith(github.head_ref, 'release-please--')
    runs-on: ubuntu-latest

    steps:
      # persist-credentials: false — aucun jeton n'est écrit dans .git/config,
      # donc ni les scripts d'installation des dépendances ni le script de
      # réécriture ne peuvent lire le jeton personnel (longue durée).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          persist-credentials: false

      # Skip rapide, avant toute installation :
      # - le dernier commit est déjà notre réécriture (ce workflow se redéclenche
      #   sur son propre push) ;
      # - ou CHANGELOG.md ne diffère pas de main (comparaison avec origin/main,
      #   la base de la PR, pas HEAD~1 qui ne voit que le dernier commit).
      - name: Vérifier s'il y a un changelog à réécrire
        id: check-changelog
        run: |
          if [ "$(git log -1 --format=%s)" = "docs(changelog): réécriture automatique en langage utilisateur" ]; then
            echo "Dernier commit = réécriture déjà faite — skip."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif git diff origin/main --name-only | grep -q "^CHANGELOG.md$"; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "CHANGELOG.md inchangé — skip."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: pnpm/action-setup@v4
        if: steps.check-changelog.outputs.changed == 'true'
        with:
          version: 10.30.0

      - uses: actions/setup-node@v4
        if: steps.check-changelog.outputs.changed == 'true'
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Installer les dépendances
        if: steps.check-changelog.outputs.changed == 'true'
        run: pnpm install --frozen-lockfile

      # Boucle retry : Release Please peut force-push la branche pendant que
      # ce workflow tourne, causant un rejet du push. On recommence à zéro
      # (fetch + reset + humanise + commit + push) jusqu'à 3 fois.
      - name: Humaniser et committer (avec retry)
        if: steps.check-changelog.outputs.changed == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BRANCH: ${{ github.head_ref }}
          PUSH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          for i in 1 2 3; do
            echo "=== Tentative $i/3 ==="

            # Repartir du HEAD distant (en cas de force-push entre-temps).
            # Dépôt public : la lecture ne demande aucun jeton.
            git fetch origin "$BRANCH"
            git reset --hard "origin/$BRANCH"

            # Humaniser, sans exposer le jeton personnel au script
            env -u PUSH_TOKEN pnpm tsx scripts/humanize-changelog.ts

            # Vérifier si le script a modifié quelque chose
            if git diff --quiet; then
              echo "Changelog déjà au format utilisateur — rien à committer."
              exit 0
            fi

            # Committer et pousser
            git add CHANGELOG.md
            # Pas de [skip ci] : poussé avec RELEASE_PLEASE_TOKEN, ce commit relance la CI
            # sur le head final de la PR, ce qui rend inutile le commit vide de /release.
            git commit -m "docs(changelog): réécriture automatique en langage utilisateur"

            if git push "https://x-access-token:${PUSH_TOKEN}@github.com/${REPO}.git" "HEAD:${BRANCH}"; then
              echo "Push réussi à la tentative $i."
              exit 0
            fi

            echo "Push rejeté — Release Please a probablement force-push entre-temps."
          done

          echo "Échec après 3 tentatives."
          exit 1
