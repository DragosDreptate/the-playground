name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Les droits d'écriture viennent de RELEASE_PLEASE_TOKEN (jeton personnel à
# portée fine : Contents, Pull requests, Issues sur ce seul dépôt), pas du
# GITHUB_TOKEN. Avec GITHUB_TOKEN, les événements de la PR de release ne
# déclenchaient pas normalement les workflows (runs en attente d'approbation).
permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
